# Hand-written API description for `ao3mirror serve` (docs/part2-api.md).
#
# internal/web/api's route-coverage test checks that the operations here match the routers exactly:
# every operation without `x-admin-only: true` is on the public listener, and every operation is
# on the admin socket. OpenAPI 3.2 is used for its native `query` operation (RFC 10008).
openapi: 3.2.0
info:
  title: ao3mirror API
  version: v1
  description: |
    Every string in a response is replaced with a keyed hash (`h_` + 24 hex) unless it is a
    registered enum value, an `_at` RFC 3339 UTC timestamp or an `_on` date. Only the per-request
    reveal query parameter returns real content. Every response carries `X-Fanwork:
    hashed|revealed`; hashed responses carry `X-Fanwork-Key-Epoch`, and hashes are comparable
    only within one epoch.
servers:
  - url: /
paths:
  /api/v1/healthz:
    get:
      operationId: getHealthz
      summary: Liveness check.
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Build and parser versions.
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sources:
    get:
      operationId: listSources
      summary: One page of sources, ordered by id.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of sources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addSource
      summary: Add a source.
      description: |
        A listing source (tag, user, pseud, bookmarks, collection, series) is queued for the
        daemon, which fetches page 1 and creates it (202; poll the Location). A single work is
        added at once (201). An existing source is 409 `already-exists`, with the source as
        Location. Invalid members are one 422 `validation-error` listing each by `pointer`; a
        URL that is not a supported AO3 source page gets its reason's hint at `/url`. `confirm`
        is accepted only on the admin socket (a validation error at `/confirm` on the public
        listener), so a source over `sources.auto_confirm_max` added publicly waits for
        `source confirm`. Rate limited per client by `api.rate.source_add_per_hour`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceAddRequest" }
      responses:
        "201":
          description: The single-work source was added.
          headers:
            Location: { description: "The source.", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceAddResult" }
        "202":
          description: The add is queued (or the same add already was).
          headers:
            Location:
              {
                description: "The source add (`/api/v1/source-adds/{job_id}`).",
                schema: { type: string },
              }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceAddQueued" }
        "409":
          description: The source already exists (`already-exists`).
          headers:
            Location:
              { description: "The existing source.", schema: { type: string } }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sources/{id}:
    get:
      operationId: getSource
      summary: One source.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: setSourceSettings
      summary: Change a source's poll interval and/or priority.
      description: |
        An absent member keeps its current value, so `{}` changes nothing. A shorter poll
        interval takes effect at once (the next poll moves earlier if needed). GET the source
        for the new settings.
      x-admin-only: true
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceSettingsRequest" }
      responses:
        "204": { description: The settings were changed. }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeSource
      summary: Remove a source and its memberships; mirrored works are kept.
      x-admin-only: true
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: The source was removed. }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sources/{id}/confirm:
    post:
      operationId: confirmSource
      summary: Activate a source waiting for confirmation (pending_confirm → active).
      description: Any other state is 409 `state-conflict`.
      x-admin-only: true
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: The source is active. }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sources/{id}/pause:
    post:
      operationId: pauseSource
      summary: Stop scheduling a source (pending_confirm, active or done_backfill → paused).
      description: |
        Its queued jobs stay queued but are not picked. Any other state is 409 `state-conflict`.
      x-admin-only: true
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: The source is paused. }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sources/{id}/resume:
    post:
      operationId: resumeSource
      summary: Re-activate a paused source (paused → active).
      description: Any other state is 409 `state-conflict`.
      x-admin-only: true
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: The source is active. }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sources/{id}/cancel:
    post:
      operationId: cancelSource
      summary: Stop a source for good and drop its queued jobs; mirrored works are kept.
      description: An already cancelled source is 409 `state-conflict`.
      x-admin-only: true
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The source is cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceCancelled" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sources/{id}/refresh:
    post:
      operationId: refreshSource
      summary: Make a source catch up now instead of waiting.
      description: |
        Its next update poll is due now and its failed work fetches are queued again. With
        `full`, the whole listing is re-walked (a rescan) and a parse-failure block is cleared.
        Only active and done_backfill sources can be refreshed; any other state is 409
        `state-conflict`. The running daemon picks the change up within seconds.
      x-admin-only: true
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceRefreshRequest" }
      responses:
        "200":
          description: What the refresh scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceRefreshed" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/source-adds/{job_id}:
    get:
      operationId: getSourceAdd
      summary: Where a queued source add stands.
      description: |
        404 when the job does not exist or is not a source add, and when a done add's source
        was removed since.
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ID" }
      responses:
        "200":
          description: The add's job state, its last error and, once done, the result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceAdd" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/jobs:
    get:
      operationId: listJobs
      summary: One page of jobs, newest first (state=queued lists them in queue order).
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/JobState" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/JobKind" }
        - name: source_id
          in: query
          schema: { $ref: "#/components/schemas/ID" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of the matching jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      summary: One job.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Daemon, queue and progress overview.
      responses:
        "200":
          description: The overview. Count lists hold only values with rows, sorted by value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/works:
    get:
      operationId: listWorks
      summary: One page of every stored work, most recently revised first by default.
      description: |
        Each item is a listing blurb: no notes, collections or chapter list (see
        `GET /api/v1/works/{id}`). Content strings are hashed unless revealed; HTML is untrusted.
        Every sort ends with the work id, in the same direction, so pages are stable. Title and
        creator sorts follow AO3's sort keys; in hashed mode the order still says a little about
        the hidden text.
      parameters:
        - name: sort
          in: query
          description: "`best_match` needs a search query, which only `QUERY` takes: 422 here."
          schema: { $ref: "#/components/schemas/WorkSort" }
        - name: direction
          in: query
          description: Omitted, ascending for `title` and `creator` and descending for the rest.
          schema: { $ref: "#/components/schemas/SortDirection" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of the works.
          headers:
            Accept-Query: { $ref: "#/components/headers/AcceptQuery" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkList" }
        default: { $ref: "#/components/responses/Problem" }
    query:
      operationId: queryWorks
      summary: One page of the stored works matching an AO3-style search and filters.
      description: |
        The body holds the search query, filters, sort and direction (absent members match
        everything, so `{}` is the `GET` listing); paging stays in the query string. `q` and
        `language` are free text, so in hashed mode they are refused with `reveal-required`.
        Every QUERY search route shares the
        per-client search rate limit (`api.rate.search_per_min`) on top of the general one.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkQueryRequest" }
      responses:
        "200":
          description: A page of the matching works.
          headers:
            Accept-Query: { $ref: "#/components/headers/AcceptQuery" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkList" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/works/{id}:
    get:
      operationId: getWork
      summary: One stored work's metadata, relations and chapter list (no chapter bodies).
      description: |
        Content strings are hashed unless revealed. HTML fields hold AO3's markup as stored
        (untrusted: sanitize before display). A work known only from listing blurbs has no
        chapters, notes, published date or `last_fetched_at`.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/works/{id}/skin:
    get:
      operationId: getWorkSkin
      summary: One stored work's skin CSS.
      description: Untrusted CSS (hashed unless revealed); sanitize and scope it before use.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The skin; `css` is omitted when the work has none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkSkin" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/works/{id}/chapters:
    get:
      operationId: getWorkChapters
      summary: Every chapter of a stored work, with bodies, in order.
      description: |
        Content strings are hashed unless revealed; HTML is untrusted. A work whose chapters
        are over 16 MiB together (bodies, notes, end notes, summaries) is refused with 422
        `work-too-large`: read it one chapter at a time instead.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The chapters (`[]` for a work known only from listing blurbs).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkChapters" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/works/{id}/chapters/{position}:
    get:
      operationId: getChapter
      summary: One chapter of a stored work, with its body, notes and end notes.
      description: |
        Content strings are hashed unless revealed; HTML is untrusted. 404 `not-found` when no
        chapter is stored at the position (a work known only from listing blurbs has none).
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: position
          in: path
          required: true
          description: The 1-based chapter position.
          schema: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        "200":
          description: The chapter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/tags:
    query:
      operationId: queryTags
      summary: One page of the stored tags matching an AO3-style tag search.
      description: |
        The body holds the filters, sort and direction (absent members match everything, so `{}`
        lists every stored tag by name); paging stays in the query string. Names are hashed
        unless revealed; `name` is free text, so in hashed mode it is refused with
        `reveal-required`. Every sort ends with the name and then the id, so pages are stable; in
        hashed mode the name order still says a little about the hidden text. It shares the
        search rate limit.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagQueryRequest" }
      responses:
        "200":
          description: A page of the matching tags.
          headers:
            Accept-Query: { $ref: "#/components/headers/AcceptQuery" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagList" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/tags/{id}:
    get:
      operationId: getTag
      summary: One stored tag with what its AO3 tag page shows.
      description: |
        The tag's wrangling state, the tag it is a synonym of, its parents, children, direct
        meta and sub tags and synonyms (each grouped by type, at most 100 per type) and how many
        stored works a filter on it matches. Names are hashed unless revealed; hashes match the
        `tags` of `GET /api/v1/works/{id}` in the same key epoch.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/tags/{id}/works:
    get:
      operationId: listTagWorks
      summary: One page of the stored works a filter on a tag matches, as AO3's tag works page.
      description: |
        `GET /api/v1/works` scoped to the tag: works tagged with it, a synonym of it or any of
        its sub tags (transitively) or their synonyms. `total` equals the tag's `works_count`.
        404 `not-found` for an unknown tag.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: sort
          in: query
          description: "`best_match` needs a search query, which only `QUERY` takes: 422 here."
          schema: { $ref: "#/components/schemas/WorkSort" }
        - name: direction
          in: query
          description: Omitted, ascending for `title` and `creator` and descending for the rest.
          schema: { $ref: "#/components/schemas/SortDirection" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of the tag's works.
          headers:
            Accept-Query: { $ref: "#/components/headers/AcceptQuery" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkList" }
        default: { $ref: "#/components/responses/Problem" }
    query:
      operationId: queryTagWorks
      summary: One page of a tag's stored works matching an AO3-style search and filters.
      description: |
        `QUERY /api/v1/works` with the path tag as one more tag every work must match (on top of
        `tag_ids`). It shares the search rate limit. 404 `not-found` for an unknown tag.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkQueryRequest" }
      responses:
        "200":
          description: A page of the tag's matching works.
          headers:
            Accept-Query: { $ref: "#/components/headers/AcceptQuery" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkList" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/tags/by-name/{name}:
    get:
      operationId: getTagByName
      summary: One stored tag by name, as AO3's /tags/{name} page.
      description: |
        `GET /api/v1/tags/{id}` for the tag with this name (case-insensitive). The name is free
        text, so in hashed mode it is refused with `reveal-required`.
      parameters:
        - name: name
          in: path
          required: true
          description: |
            The tag name in AO3's /tags/ path form: `*s*` for `/`, `*a*` for `&`, `*d*` for `.`,
            `*q*` for `?` and `*h*` for `#`, then percent-encoded. At most 256 characters decoded.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/debug/jobs/{id}:
    get:
      operationId: debugJob
      summary: One job's content-free trace, with its events and requests.
      x-admin-only: true
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The job, its events and its last 20 requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDebug" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/debug/works/{id}:
    get:
      operationId: debugWork
      summary: One work's numbers, dates and states, with its fetch jobs and requests.
      description: No content (title, names, tags, text) is included, even when revealed.
      x-admin-only: true
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The work's diagnostic view, its last 20 fetch jobs and requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkDebug" }
        default: { $ref: "#/components/responses/Problem" }
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    Page:
      name: page
      in: query
      description: 1-based page number; (page-1)*per_page is at most 100000.
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    AcceptQuery:
      description: The resource accepts QUERY with these body media types (RFC 10008).
      schema: { type: string, enum: [application/json] }
  responses:
    Problem:
      description: An RFC 9457 problem. Every field is an enumerable value.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details. Every string is from a fixed set (types, titles, the detail
        catalogue, declared parameter names); docs/api/problems.md documents each type.
      required: [type, title, status]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI, `https://github.com/rmb938/personal-aO3-mirror/blob/main/docs/api/problems.md#<slug>`.
        title: { type: string, description: "The type's fixed title." }
        status: { type: integer }
        detail:
          {
            type: string,
            description: "What went wrong in this occurrence and how to fix it.",
          }
        errors:
          type: array
          description: The invalid parts of the request (validation-error).
          items:
            type: object
            required: [detail]
            additionalProperties: false
            properties:
              detail: { type: string }
              parameter:
                {
                  type: string,
                  description: "The query or path parameter at fault, when it is a declared name.",
                }
              pointer:
                {
                  type: string,
                  description: "RFC 6901 JSON Pointer to the body member at fault.",
                }
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok] }
    Version:
      type: object
      required: [version, parser_version]
      additionalProperties: false
      properties:
        version: { type: string }
        parser_version: { type: integer }
    ID:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    Duration:
      type: string
      description: A Go duration string, e.g. `6h0m0s`, `1.5s` (what Go's time.Duration.String writes).
      format: duration
      example: 6h0m0s
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC.
    SourceList:
      type: object
      required: [items, page, per_page, total]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Source" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, description: "Sources over all pages." }
    Order:
      type: string
      description: Listing sort, `<field>_<asc|desc>`.
      enum:
        [
          author_asc,
          author_desc,
          bookmarks_asc,
          bookmarks_desc,
          comments_asc,
          comments_desc,
          created_asc,
          created_desc,
          hits_asc,
          hits_desc,
          kudos_asc,
          kudos_desc,
          revised_asc,
          revised_desc,
          title_asc,
          title_desc,
          words_asc,
          words_desc,
        ]
    Source:
      type: object
      required:
        [
          id,
          kind,
          target,
          filters,
          path,
          state,
          poll_interval,
          priority,
          total_works,
          est_requests,
          member_works,
          fetched_works,
        ]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        kind:
          {
            type: string,
            enum: [tag, user, pseud, user_bookmarks, series, collection, work],
          }
        target:
          {
            type: string,
            description: "Tag, user or collection name, or series/work id (hashed).",
          }
        target_id:
          {
            $ref: "#/components/schemas/ID",
            description: "Numeric target of a series or work source.",
          }
        filters:
          type: array
          description: work_search filters, sorted by name.
          items:
            type: object
            required: [name, values]
            additionalProperties: false
            properties:
              name: { type: string }
              values: { type: array, items: { type: string } }
        path: { type: string, description: "AO3 listing path (hashed)." }
        state: { $ref: "#/components/schemas/SourceState" }
        order: { $ref: "#/components/schemas/Order" }
        poll_interval: { $ref: "#/components/schemas/Duration" }
        priority: { type: integer }
        total_works:
          { type: [integer, "null"], description: "null until known." }
        est_requests:
          { type: [integer, "null"], description: "null until known." }
        member_works: { type: integer }
        fetched_works: { type: integer }
        backfill: { $ref: "#/components/schemas/Backfill" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        last_poll_at: { $ref: "#/components/schemas/Timestamp" }
        next_poll_at: { $ref: "#/components/schemas/Timestamp" }
        last_full_scan_at: { $ref: "#/components/schemas/Timestamp" }
        backfill_done_at: { $ref: "#/components/schemas/Timestamp" }
        last_error:
          {
            type: string,
            description: "Last poll or backfill error (hashed whole).",
          }
    Backfill:
      type: object
      required: [next_page]
      additionalProperties: false
      properties:
        next_page:
          { type: integer, description: "0 once the listing walk is done." }
        order: { $ref: "#/components/schemas/Order" }
        window_start_on: { type: string, format: date }
        window_end_on: { type: string, format: date }
        rescan: { type: boolean }
        rescan_started_at: { $ref: "#/components/schemas/Timestamp" }
        blocked_parser:
          {
            type: integer,
            description: "Parser version that failed on next_page.",
          }
        retry_at: { $ref: "#/components/schemas/Timestamp" }
    SourceAdd:
      type: object
      required: [job_id, state]
      additionalProperties: false
      properties:
        job_id: { $ref: "#/components/schemas/ID" }
        state: { $ref: "#/components/schemas/JobState" }
        last_error_code: { $ref: "#/components/schemas/JobErrorCode" }
        last_error_detail:
          { type: string, description: "The rest of the last error (hashed)." }
        existing_source_id:
          allOf: [{ $ref: "#/components/schemas/ID" }]
          description: >-
            Set when the add failed with `source_exists`: the source that already existed
            (`last_error_detail` is hashed, so the id is given here).
        result: { $ref: "#/components/schemas/SourceAddResult" }
    SourceAddResult:
      type: object
      required: [source, blurbs, estimate]
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/Source" }
        blurbs:
          { type: integer, description: "Listing blurbs stored from page 1." }
        estimate: { $ref: "#/components/schemas/Estimate" }
    SourceAddRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          {
            type: string,
            maxLength: 2048,
            description: "An AO3 tag, user, pseud, bookmarks, collection, series or work URL.",
          }
        order: { $ref: "#/components/schemas/Order" }
        priority: { type: integer, minimum: -1000, maximum: 1000, default: 0 }
        poll_interval:
          allOf: [{ $ref: "#/components/schemas/Duration" }]
          description: >-
            Update poll interval, from 10m to 720h (30 days); absent (or zero) uses
            `sources.poll_interval`. Any Go duration string is accepted (`6h`, `90m`).
        confirm:
          {
            type: boolean,
            description: "Skip the auto_confirm_max gate (admin socket only).",
          }
    SourceAddQueued:
      type: object
      required: [job_id, created]
      additionalProperties: false
      properties:
        job_id: { $ref: "#/components/schemas/ID" }
        created:
          {
            type: boolean,
            description: "False when the same add was already queued (this request's options were dropped).",
          }
    SourceCancelled:
      type: object
      required: [dropped_jobs]
      additionalProperties: false
      properties:
        dropped_jobs:
          {
            type: integer,
            minimum: 0,
            description: "How many of the source's queued jobs were cancelled.",
          }
    SourceRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        full:
          {
            type: boolean,
            default: false,
            description: "Re-walk the whole listing now (rescan) and clear a parse-failure block.",
          }
    SourceRefreshed:
      type: object
      required: [poll_now, requeued_works, rescan_started, unblocked_parser]
      additionalProperties: false
      properties:
        poll_now:
          { type: boolean, description: "The next update poll is due now." }
        requeued_works:
          {
            type: integer,
            minimum: 0,
            description: "How many of the source's failed work fetches were queued again.",
          }
        rescan_started:
          {
            type: boolean,
            description: "A full refresh of a done_backfill source started a re-walk (the source is active again).",
          }
        unblocked_parser:
          {
            type: boolean,
            description: "A full refresh cleared the backfill's parse-failure block.",
          }
    SourceSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        poll_interval:
          allOf: [{ $ref: "#/components/schemas/Duration" }]
          description: >-
            Update poll interval, from 10m to 720h (30 days); absent (or zero) keeps the current
            one. Any Go duration string is accepted (`6h`, `90m`).
        priority:
          type: [integer, "null"]
          minimum: -1000
          maximum: 1000
          description: Priority within a scheduling class (higher first); absent or null keeps the current one.
    Estimate:
      type: object
      required:
        [
          total,
          pages,
          listing_requests,
          work_fetches,
          requests,
          duration,
          disk_bytes,
          windowed,
        ]
      additionalProperties: false
      properties:
        total: { type: integer }
        pages: { type: integer }
        listing_requests: { type: integer }
        work_fetches: { type: integer }
        requests: { type: integer }
        duration: { $ref: "#/components/schemas/Duration" }
        disk_bytes: { type: integer }
        windowed:
          {
            type: boolean,
            description: "Backfill sliced into revised-date windows (over 100k results).",
          }
    JobState:
      type: string
      enum: [queued, running, done, failed, cancelled]
    JobKind:
      type: string
      enum: [poll, backfill, work, tag_info, series_info, source_add]
    JobErrorCode:
      type: string
      description: A job's last error code (before the first `:`).
      enum:
        [
          parse_unexpected,
          parse_error,
          not_found,
          restricted,
          hidden,
          adult_gate,
          too_large,
          robots_disallowed,
          robots_unavailable,
          unexpected_response,
          bad_source,
          bad_filters,
          bad_cursor,
          bad_work_id,
          bad_series_id,
          no_source,
          no_tag,
          panic,
          internal,
          source_exists,
          no_source_add,
          rate_limited,
          unavailable,
          crashed,
        ]
    JobList:
      type: object
      required: [items, page, per_page, total]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, description: "Matching jobs over all pages." }
    Job:
      type: object
      required: [id, kind, target, priority, state, attempts, max_attempts]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        kind: { $ref: "#/components/schemas/JobKind" }
        target:
          {
            type: integer,
            description: "Page number, work/tag/series id or source add id.",
          }
        source_id:
          {
            $ref: "#/components/schemas/ID",
            description: "The job's source, when it has one.",
          }
        priority: { type: integer, description: "Class: lower runs first." }
        state: { $ref: "#/components/schemas/JobState" }
        attempts: { type: integer }
        max_attempts: { type: integer }
        last_error_code: { $ref: "#/components/schemas/JobErrorCode" }
        last_error_detail:
          { type: string, description: "The rest of the last error (hashed)." }
        not_before_at:
          {
            $ref: "#/components/schemas/Timestamp",
            description: "A queued job waits until then.",
          }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
    SourceState:
      type: string
      enum: [pending_confirm, active, paused, cancelled, done_backfill]
    Status:
      type: object
      required:
        [
          daemon,
          works,
          tags,
          creators,
          series,
          raw_pages,
          requests,
          sources,
          images,
          tag_info,
          jobs,
          partial_series,
          request_errors,
          failed_jobs,
        ]
      additionalProperties: false
      properties:
        daemon: { $ref: "#/components/schemas/Daemon" }
        works:
          type: object
          required: [by_status, fetched, never_fetched, parse_failures]
          additionalProperties: false
          properties:
            by_status:
              type: array
              items:
                type: object
                required: [status, count]
                additionalProperties: false
                properties:
                  status:
                    {
                      type: string,
                      enum: [ok, deleted, hidden, restricted, unrevealed],
                    }
                  count: { type: integer }
            fetched: { type: integer }
            never_fetched:
              {
                type: integer,
                description: "Ok works with no fetched page yet.",
              }
            parse_failures:
              {
                type: integer,
                description: "Fetched works the current parser could not parse.",
              }
        tags: { type: integer }
        creators: { type: integer }
        series: { type: integer }
        raw_pages:
          type: object
          required: [count, bytes, zstd_bytes]
          additionalProperties: false
          properties:
            count: { type: integer }
            bytes: { type: integer, description: "Uncompressed size." }
            zstd_bytes: { type: integer, description: "Stored size." }
        requests:
          type: object
          required: [last_1h, last_24h, by_class_24h]
          additionalProperties: false
          properties:
            last_1h: { type: integer }
            last_24h: { type: integer }
            by_class_24h:
              type: array
              items:
                type: object
                required: [class, count]
                additionalProperties: false
                properties:
                  class: { $ref: "#/components/schemas/RequestClass" }
                  count: { type: integer }
        sources:
          type: array
          items:
            type: object
            required: [state, count]
            additionalProperties: false
            properties:
              state: { $ref: "#/components/schemas/SourceState" }
              count: { type: integer }
        images:
          type: object
          required: [by_status, bytes]
          additionalProperties: false
          properties:
            by_status:
              type: array
              items:
                type: object
                required: [status, count]
                additionalProperties: false
                properties:
                  status:
                    {
                      type: string,
                      enum:
                        [queued, ok, failed, skipped, too_large, disallowed],
                    }
                  count: { type: integer }
            bytes: { type: integer, description: "Size of the stored images." }
        tag_info:
          type: object
          description: Tag info fetch progress over tags of the configured types used by a mirrored work.
          required: [types, total, fetched, due]
          additionalProperties: false
          properties:
            types:
              type: array
              description: The configured tag types (empty when tag info is off).
              items:
                {
                  type: string,
                  enum: [Fandom, Relationship, Character, Freeform],
                }
            total: { type: integer }
            fetched: { type: integer }
            due:
              {
                type: integer,
                description: "Never fetched or older than the refresh interval.",
              }
        jobs:
          type: array
          description: Job counts by kind and state, sorted by kind, then state.
          items:
            type: object
            required: [kind, state, count]
            additionalProperties: false
            properties:
              kind: { $ref: "#/components/schemas/JobKind" }
              state: { $ref: "#/components/schemas/JobState" }
              count: { type: integer }
        partial_series:
          type: array
          description: Series that are not sources and have fewer mirrored works than AO3 lists.
          items:
            type: object
            required:
              [id, works_total, mirrored, missing_positions, missing_work_ids]
            additionalProperties: false
            properties:
              id: { $ref: "#/components/schemas/ID" }
              works_total: { type: integer, description: "AO3's count." }
              mirrored: { type: integer }
              missing_positions:
                {
                  type: array,
                  items: { type: integer },
                  description: "Part numbers none of our works has.",
                }
              missing_work_ids:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/ID" },
                  description: "Known members not fetched.",
                }
        request_errors:
          type: array
          description: The most recent requests whose outcome was not ok, newest first.
          items: { $ref: "#/components/schemas/Request" }
        failed_jobs:
          type: array
          description: The most recent failed jobs, newest first.
          items: { $ref: "#/components/schemas/Job" }
    Daemon:
      type: object
      required: [running, pacer]
      additionalProperties: false
      properties:
        running:
          {
            type: boolean,
            description: "A heartbeat within 2 minutes that is not a clean stop.",
          }
        heartbeat_at:
          {
            $ref: "#/components/schemas/Timestamp",
            description: "Omitted when the daemon never ran.",
          }
        pid: { type: integer }
        phase: { type: string, enum: [idle, running, between, stopped] }
        current_job: { $ref: "#/components/schemas/ID" }
        waiting_until_at:
          {
            $ref: "#/components/schemas/Timestamp",
            description: "When a waiting request gets its slot.",
          }
        pacer:
          type: object
          required:
            [
              interval,
              slow_factor,
              consec_fails,
              breaker_open,
              day_count,
              daily_budget,
            ]
          additionalProperties: false
          properties:
            interval: { $ref: "#/components/schemas/Duration" }
            slow_factor: { type: number }
            consec_fails: { type: integer }
            breaker_open: { type: boolean }
            day_count: { type: integer }
            daily_budget: { type: integer, description: "0: no budget." }
            backoff_until_at: { $ref: "#/components/schemas/Timestamp" }
    RequestClass:
      type: string
      enum:
        [
          ok,
          not_found,
          restricted,
          hidden,
          adult_gate,
          rate_limited,
          unavailable,
          parse_unexpected,
        ]
    Request:
      type: object
      description: One AO3 request the scraper made.
      required:
        [
          requested_at,
          req_id,
          kind,
          path,
          status,
          class,
          reason,
          bytes,
          duration,
          waited,
          hop,
        ]
      additionalProperties: false
      properties:
        requested_at: { $ref: "#/components/schemas/Timestamp" }
        req_id:
          { type: string, description: "Request id in the logs (hashed)." }
        job_id:
          {
            $ref: "#/components/schemas/ID",
            description: "The job that made it.",
          }
        kind: { type: string, enum: [robots, listing, work, tag, series, page] }
        path: { type: string, description: "Request path (hashed)." }
        status:
          {
            type: integer,
            description: "HTTP status (0 when the request failed in transport).",
          }
        class: { $ref: "#/components/schemas/RequestClass" }
        reason: { type: string, description: "Classifier reason (hashed)." }
        bytes: { type: integer }
        duration: { $ref: "#/components/schemas/Duration" }
        waited: { $ref: "#/components/schemas/Duration" }
        hop:
          { type: integer, description: "Redirect hop (0: the first request)." }
    JobEventType:
      type: string
      enum: [start, done, failed, retry, error, wait]
    JobDebug:
      type: object
      required: [job, dedupe_key, events, requests]
      additionalProperties: false
      properties:
        job: { $ref: "#/components/schemas/Job" }
        dedupe_key:
          {
            type: string,
            description: "Keeps a second copy of the job from being queued (hashed).",
          }
        events:
          type: array
          description: The job's trace events, oldest first.
          items: { $ref: "#/components/schemas/JobEvent" }
        requests:
          type: array
          description: The job's last 20 requests, newest first.
          items: { $ref: "#/components/schemas/Request" }
    JobEvent:
      type: object
      description: |
        One job trace event: the scheduler's outcome, and the detail of the job's kind in the
        member named after the kind (the other kind members are omitted). Every outcome and
        detail field is present, null when the run did not set it. A start event sets only
        the outcome's attempt and target.
      required: [occurred_at, event, outcome]
      additionalProperties: false
      properties:
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        event: { $ref: "#/components/schemas/JobEventType" }
        outcome: { $ref: "#/components/schemas/JobOutcome" }
        poll: { $ref: "#/components/schemas/PollDetail" }
        backfill: { $ref: "#/components/schemas/BackfillDetail" }
        work: { $ref: "#/components/schemas/WorkDetail" }
        tag_info: { $ref: "#/components/schemas/TagInfoDetail" }
        series_info: { $ref: "#/components/schemas/SeriesInfoDetail" }
        source_add: { $ref: "#/components/schemas/SourceAddDetail" }
    JobOutcome:
      type: object
      required:
        [
          attempt,
          target,
          duration,
          error_code,
          error_detail,
          next_state,
          not_before_at,
        ]
      additionalProperties: false
      properties:
        attempt:
          {
            type: [integer, "null"],
            description: "Start event: the attempt number, counting this one.",
          }
        target:
          {
            type: [integer, "null"],
            description: "Start event: the job's target.",
          }
        duration:
          {
            anyOf:
              [{ $ref: "#/components/schemas/Duration" }, { type: "null" }],
            description: "How long the handler ran.",
          }
        error_code:
          {
            anyOf:
              [{ $ref: "#/components/schemas/JobErrorCode" }, { type: "null" }],
          }
        error_detail:
          {
            type: [string, "null"],
            description: "The rest of the error after the first `:` (hashed).",
          }
        next_state:
          anyOf: [{ $ref: "#/components/schemas/JobState" }, { type: "null" }]
          description: After a retryable error, queued again or failed when out of attempts.
        not_before_at:
          anyOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
          description: The requeued job waits until then.
    PollDetail:
      type: object
      required:
        [
          page,
          blurbs,
          new,
          changed,
          work_jobs,
          requeued_unfetched,
          continue,
          total,
          req_id,
        ]
      additionalProperties: false
      properties:
        page: { type: [integer, "null"] }
        blurbs: { type: [integer, "null"] }
        new:
          { type: [integer, "null"], description: "Works new to the mirror." }
        changed:
          {
            type: [integer, "null"],
            description: "Works whose listing changed.",
          }
        work_jobs:
          { type: [integer, "null"], description: "Work fetches queued." }
        requeued_unfetched:
          {
            type: [integer, "null"],
            description: "Member works queued again because an earlier fetch failed or never ran.",
          }
        continue:
          {
            type: [boolean, "null"],
            description: "The poll goes on to the next page.",
          }
        total:
          {
            type: [integer, "null"],
            description: "The listing's work count (-1 when it shows none).",
          }
        req_id:
          {
            type: [string, "null"],
            description: "Request id in the logs (hashed).",
          }
    BackfillDetail:
      type: object
      required:
        [
          page,
          blurbs,
          new,
          rescan,
          work_jobs,
          total,
          req_id,
          next_page,
          window_start_on,
          window_end_on,
          shrink_span_days,
          truncated_at_max_results,
          total_beyond_pages,
          stale_after_fetch,
          stale,
          cursor_page,
          blocked_parser,
          retry_at,
        ]
      additionalProperties: false
      properties:
        page: { type: [integer, "null"] }
        blurbs: { type: [integer, "null"] }
        new: { type: [integer, "null"] }
        rescan: { type: [boolean, "null"] }
        work_jobs: { type: [integer, "null"] }
        total:
          {
            type: [integer, "null"],
            description: "The listing's work count (-1 when it shows none).",
          }
        req_id:
          {
            type: [string, "null"],
            description: "Request id in the logs (hashed).",
          }
        next_page: { type: [integer, "null"] }
        window_start_on:
          {
            type: [string, "null"],
            format: date,
            description: "Revised-date window walked (windowed sources).",
          }
        window_end_on: { type: [string, "null"], format: date }
        shrink_span_days:
          {
            type: [integer, "null"],
            description: "New window span after a window over AO3's result limit was halved.",
          }
        truncated_at_max_results: { type: [boolean, "null"] }
        total_beyond_pages:
          {
            type: [boolean, "null"],
            description: "The listing total is more than the pages walked hold.",
          }
        stale_after_fetch:
          {
            type: [boolean, "null"],
            description: "A refresh moved the cursor during the fetch; the cursor was left alone.",
          }
        stale:
          {
            type: [boolean, "null"],
            description: "The cursor was already past this page (at cursor_page); nothing was fetched.",
          }
        cursor_page: { type: [integer, "null"] }
        blocked_parser:
          {
            type: [integer, "null"],
            description: "Parser version the backfill is blocked on after a parse failure.",
          }
        retry_at:
          anyOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
          description: The page is held back until then after a permanent failure.
    WorkDetail:
      type: object
      required:
        [
          work_id,
          class,
          bytes,
          req_id,
          status,
          chapters,
          words,
          content,
          revived,
          left_sources,
          images_queued,
          meta_changed,
          chapter_count_mismatch,
        ]
      additionalProperties: false
      properties:
        work_id: { type: [integer, "null"] }
        class:
          {
            anyOf:
              [{ $ref: "#/components/schemas/RequestClass" }, { type: "null" }],
          }
        bytes: { type: [integer, "null"] }
        req_id:
          {
            type: [string, "null"],
            description: "Request id in the logs (hashed).",
          }
        status:
          type: [string, "null"]
          enum: [ok, deleted, hidden, restricted, unrevealed, null]
          description: The work's new status when AO3 no longer serves it.
        chapters: { type: [integer, "null"] }
        words: { type: [integer, "null"] }
        content:
          {
            type: [string, "null"],
            enum: [new, changed, unchanged, null],
            description: "Stored content compared with the copy before.",
          }
        revived:
          {
            type: [boolean, "null"],
            description: "The work was deleted, hidden or restricted before.",
          }
        left_sources:
          {
            type: [integer, "null"],
            description: "Sources that dropped the work after missing it in rescans.",
          }
        images_queued: { type: [integer, "null"] }
        meta_changed:
          type: [array, "null"]
          description: Changed fields and related-row changes, names and counts only (hashed).
          items: { type: string }
        chapter_count_mismatch: { type: [boolean, "null"] }
    TagType:
      type: string
      enum:
        [
          Rating,
          ArchiveWarning,
          Category,
          Fandom,
          Relationship,
          Character,
          Freeform,
          Media,
          Unknown,
        ]
    Tag:
      type: object
      description: |
        A stored tag. Strings other than the `type`s and `info_fetched_at` are content, hashed
        unless revealed. Lists are `[]` when empty.
      required:
        [
          id,
          name,
          type,
          canonical,
          merger,
          parents,
          children,
          meta_tags,
          sub_tags,
          synonyms,
          works_count,
        ]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        type: { $ref: "#/components/schemas/TagType" }
        canonical:
          type: [boolean, "null"]
          description: Null until the tag page was read; a tag merged as a synonym is not canonical.
        merger:
          description: The tag this one is a synonym of, or null.
          anyOf: [{ $ref: "#/components/schemas/TagRef" }, { type: "null" }]
        parents:
          type: array
          items: { $ref: "#/components/schemas/TagGroup" }
        children:
          type: array
          description: Tags listing this one as a parent.
          items: { $ref: "#/components/schemas/TagGroup" }
        meta_tags:
          type: array
          description: Direct meta tags only.
          items: { $ref: "#/components/schemas/TagGroup" }
        sub_tags:
          type: array
          description: Direct sub tags only.
          items: { $ref: "#/components/schemas/TagGroup" }
        synonyms:
          type: array
          items: { $ref: "#/components/schemas/TagGroup" }
        works_count:
          type: integer
          description: |
            Stored works (any status) a filter on this tag matches, counting its synonyms and
            sub tags.
        # The last tag page fetch, also one that yielded nothing (a 404 or a restricted page);
        # omitted when never fetched.
        info_fetched_at: { $ref: "#/components/schemas/Timestamp" }
    TagRef:
      type: object
      required: [id, name, type]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        type: { $ref: "#/components/schemas/TagType" }
    TagGroup:
      type: object
      description: |
        Related tags of one type: the first 100 by name (case-insensitive) and how many there
        are. Groups are in AO3's tag type order.
      required: [type, total, tags]
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/TagType" }
        total: { type: integer, minimum: 1 }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagRef" }
    TagSort:
      type: string
      description: |
        Tag listing sort column, after AO3's tag search `sort_column`: `name` (the default,
        ascending by default) or `uses` (descending by default; a tie is broken by name
        ascending). AO3's `created_at` has no stored counterpart.
      enum: [name, uses]
    TagQueryRequest:
      type: object
      additionalProperties: false
      description: |
        AO3 tag search filters. Every member is optional; absent members match everything.
        Invalid members are all listed in one `validation-error` (by JSON Pointer).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            Whitespace-separated words that must each appear in the tag's name, anywhere and
            ignoring ASCII case (AO3 `name`). 1 to 16 words, no control characters. Free text:
            refused with `reveal-required` unless the request is revealed.
        types:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/TagType" }
          description: Any of these (AO3 `type`).
        canonical:
          type: boolean
          description: >-
            true keeps canonical tags; false, tags recorded as not canonical (synonyms among
            them). A tag whose page was never read matches neither.
        parent_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/ID" }
          description: Each must be a direct parent of the tag (AO3 `fandoms`, by id).
        sort: { $ref: "#/components/schemas/TagSort" }
        direction:
          allOf: [{ $ref: "#/components/schemas/SortDirection" }]
          description: Omitted, ascending for `name` and descending for `uses`.
    TagList:
      type: object
      required: [items, page, per_page, total]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TagListItem" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, description: "Matching tags over all pages." }
    TagListItem:
      type: object
      description: A stored tag in a tag search. `name` is content, hashed unless revealed.
      required: [id, name, type, canonical, merger_id, uses]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        type: { $ref: "#/components/schemas/TagType" }
        canonical:
          type: [boolean, "null"]
          description: Null until the tag page was read; a tag merged as a synonym is not canonical.
        merger_id:
          description: The tag this one is a synonym of, or null.
          anyOf: [{ $ref: "#/components/schemas/ID" }, { type: "null" }]
        uses:
          type: integer
          description: |
            Stored works (any status) tagged with this tag itself (AO3 uses); unlike a tag's
            `works_count`, synonyms and sub tags do not count.
        # The last tag page fetch; omitted when never fetched.
        info_fetched_at: { $ref: "#/components/schemas/Timestamp" }
    TagInfoDetail:
      type: object
      required: [tag_id, class, req_id, type, canonical, parents]
      additionalProperties: false
      properties:
        tag_id: { type: [integer, "null"] }
        class:
          {
            anyOf:
              [{ $ref: "#/components/schemas/RequestClass" }, { type: "null" }],
          }
        req_id:
          {
            type: [string, "null"],
            description: "Request id in the logs (hashed).",
          }
        type:
          {
            anyOf: [{ $ref: "#/components/schemas/TagType" }, { type: "null" }],
          }
        canonical: { type: [boolean, "null"] }
        parents: { type: [integer, "null"] }
    SeriesInfoDetail:
      type: object
      required:
        [
          series_id,
          class,
          req_id,
          works_count,
          known_works_refreshed,
          members_seen,
        ]
      additionalProperties: false
      properties:
        series_id: { type: [integer, "null"] }
        class:
          {
            anyOf:
              [{ $ref: "#/components/schemas/RequestClass" }, { type: "null" }],
          }
        req_id:
          {
            type: [string, "null"],
            description: "Request id in the logs (hashed).",
          }
        works_count:
          {
            type: [integer, "null"],
            description: "AO3's count of the series' works.",
          }
        known_works_refreshed:
          {
            type: [integer, "null"],
            description: "Mirrored works updated from the series page.",
          }
        members_seen: { type: [integer, "null"] }
    SourceAddDetail:
      type: object
      required: [source_id, state, blurbs, estimate]
      additionalProperties: false
      properties:
        source_id: { type: [integer, "null"] }
        state:
          {
            anyOf:
              [{ $ref: "#/components/schemas/SourceState" }, { type: "null" }],
          }
        blurbs: { type: [integer, "null"] }
        estimate:
          {
            anyOf:
              [{ $ref: "#/components/schemas/Estimate" }, { type: "null" }],
          }
    WorkDebug:
      type: object
      required: [work, jobs, requests]
      additionalProperties: false
      properties:
        work: { $ref: "#/components/schemas/WorkDiag" }
        jobs:
          type: array
          description: The work's last 20 fetch jobs, newest first.
          items: { $ref: "#/components/schemas/Job" }
        requests:
          type: array
          description: The last 20 requests for the work's pages, newest first.
          items: { $ref: "#/components/schemas/Request" }
    WorkDiag:
      type: object
      description: A work's numbers, dates and states. Unset dates and times are omitted.
      required:
        [
          id,
          status,
          words,
          chapters_posted,
          stats,
          restricted,
          anonymous,
          parser_version,
          rows,
        ]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        status:
          { type: string, enum: [ok, deleted, hidden, restricted, unrevealed] }
        published_on: { type: string, format: date }
        revised_on: { type: string, format: date }
        fetched_revised_on:
          {
            type: string,
            format: date,
            description: "The revised date at the last full fetch.",
          }
        words: { type: integer }
        chapters_posted: { type: integer }
        chapters_expected:
          { type: integer, description: "Omitted when unknown." }
        stats: { $ref: "#/components/schemas/WorkStats" }
        restricted: { type: boolean }
        anonymous: { type: boolean }
        parser_version:
          {
            type: integer,
            description: "The parser that last parsed it (0: never, or it failed).",
          }
        first_seen_at: { $ref: "#/components/schemas/Timestamp" }
        last_listed_at: { $ref: "#/components/schemas/Timestamp" }
        last_fetched_at: { $ref: "#/components/schemas/Timestamp" }
        last_checked_at: { $ref: "#/components/schemas/Timestamp" }
        fetch_failed_at:
          {
            $ref: "#/components/schemas/Timestamp",
            description: "The last full fetch that gave up.",
          }
        rows:
          type: object
          description: Stored rows that belong to the work.
          required:
            [
              tags,
              creators,
              chapters,
              sources,
              images,
              raw_pages,
              raw_bytes,
              chapter_bodies,
            ]
          additionalProperties: false
          properties:
            tags: { type: integer }
            creators: { type: integer }
            chapters: { type: integer }
            sources: { type: integer }
            images: { type: integer }
            raw_pages: { type: integer, description: "Stored page versions." }
            raw_bytes:
              { type: integer, description: "Their uncompressed size." }
            chapter_bodies:
              { type: integer, description: "Stored chapter texts." }
    WorkStats:
      type: object
      required: [kudos, hits, comments, bookmarks]
      additionalProperties: false
      properties:
        kudos: { type: integer }
        hits: { type: integer }
        comments: { type: integer }
        bookmarks: { type: integer }
    Work:
      type: object
      description: |
        A stored work. Strings other than `status`, tag `type` and the `_on`/`_at` dates are
        content, hashed unless revealed. Lists are `[]` when empty; optional fields are omitted
        when unset.
      required:
        [
          id,
          status,
          title,
          creators,
          anonymous,
          restricted,
          words,
          chapters_posted,
          complete,
          stats,
          tags,
          series,
          collections,
          chapters,
        ]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        status:
          { type: string, enum: [ok, deleted, hidden, restricted, unrevealed] }
        title: { type: string }
        creators:
          type: array
          description: Byline order.
          items: { $ref: "#/components/schemas/WorkCreator" }
        anonymous: { type: boolean }
        restricted: { type: boolean }
        summary_html: { type: string }
        notes_html: { type: string }
        end_notes_html: { type: string }
        language: { type: string }
        words: { type: integer }
        chapters_posted: { type: integer }
        chapters_expected:
          { type: integer, description: "Omitted when unknown." }
        complete: { type: boolean }
        published_on:
          {
            type: string,
            format: date,
            description: "Known only from the work page.",
          }
        revised_on: { type: string, format: date }
        stats: { $ref: "#/components/schemas/WorkStats" }
        tags:
          type: array
          description: Page order (grouped by type).
          items: { $ref: "#/components/schemas/WorkTag" }
        series:
          type: array
          items: { $ref: "#/components/schemas/WorkSeries" }
        collections:
          type: array
          items: { $ref: "#/components/schemas/WorkCollection" }
        chapters:
          type: array
          description: The chapter list in order, without bodies.
          items: { $ref: "#/components/schemas/ChapterRef" }
        last_fetched_at:
          {
            $ref: "#/components/schemas/Timestamp",
            description: "The last full fetch; omitted for a blurb-only work.",
          }
    WorkSort:
      type: string
      description: |
        Work listing sort column, after AO3's `sort_column`: `revised` (the default without a
        search query; Date Updated), `published` (Date Posted), `words`, `hits`, `kudos`,
        `comments`, `bookmarks`, `title`, `creator`, and `best_match` (AO3 Best Match: search
        rank, best first by default; the default with a query, and only valid with one).
      enum: [revised, published, words, hits, kudos, comments, bookmarks, title, creator, best_match]
    SortDirection:
      type: string
      enum: [asc, desc]
    WorkQueryRequest:
      type: object
      additionalProperties: false
      description: |
        AO3 work_search filters. Every member is optional; absent members match everything.
        Invalid members are all listed in one `validation-error` (by JSON Pointer).
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            Search text (AO3 `query`) matched against titles, summaries, creators, tags and
            series titles: words and `"quoted phrases"` must all match, and a leading `-`
            excludes a word or phrase; nothing else is syntax. At most 16 terms, at least one
            not excluded, and no control characters. Free text: refused with
            `reveal-required` unless the request is revealed.
        tag_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/ID" }
          description: >-
            Every one must match (AO3 `filter_ids`, every tag type in one list). A tag id
            matches works tagged with it, a synonym of it, or any of its sub tags (transitively)
            or their synonyms.
        exclude_tag_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/ID" }
          description: None may match (AO3 `excluded_tag_ids`), matched like `tag_ids`.
        complete: { type: boolean, description: "AO3 `complete`." }
        crossover:
          type: boolean
          description: AO3 `crossover`; a crossover has no fandom related to all its others.
        single_chapter: { type: boolean, description: "true keeps works expecting one chapter." }
        language:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            The stored language name, matched exactly. Free text: refused with
            `reveal-required` unless the request is revealed.
        statuses:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [ok, deleted, hidden, restricted, unrevealed] }
          description: Any of these local availability states.
        fetched:
          type: boolean
          description: true keeps works whose page was fetched; false, works known only from listing blurbs.
        words: { $ref: "#/components/schemas/CountRange" }
        kudos: { $ref: "#/components/schemas/CountRange" }
        hits: { $ref: "#/components/schemas/CountRange" }
        comments: { $ref: "#/components/schemas/CountRange" }
        bookmarks: { $ref: "#/components/schemas/CountRange" }
        revised:
          allOf: [{ $ref: "#/components/schemas/DateRange" }]
          description: The last update (AO3 `date_from` / `date_to`).
        published:
          allOf: [{ $ref: "#/components/schemas/DateRange" }]
          description: The first publication; excludes works with no known date (blurb-only).
        sort: { $ref: "#/components/schemas/WorkSort" }
        direction:
          allOf: [{ $ref: "#/components/schemas/SortDirection" }]
          description: Omitted, ascending for `title` and `creator` and descending for the rest.
    CountRange:
      type: object
      additionalProperties: false
      description: An inclusive counter range; an absent end is open, and min must not be above max.
      properties:
        min: { type: integer, minimum: 0, maximum: 2147483647 }
        max: { type: integer, minimum: 0, maximum: 2147483647 }
    DateRange:
      type: object
      additionalProperties: false
      description: An inclusive range of days; an absent end is open, and from must not be after to.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    WorkList:
      type: object
      required: [items, page, per_page, total]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkBlurb" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, description: "Matching works over all pages." }
    WorkBlurb:
      type: object
      description: |
        One work in a listing: what AO3's blurb shows. Strings other than `status`, tag `type`
        and the `_on`/`_at` dates are content, hashed unless revealed. Lists are `[]` when
        empty; optional fields are omitted when unset.
      required:
        [
          id,
          status,
          title,
          creators,
          anonymous,
          restricted,
          words,
          chapters_posted,
          complete,
          stats,
          tags,
          series,
        ]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        status:
          { type: string, enum: [ok, deleted, hidden, restricted, unrevealed] }
        title: { type: string }
        creators:
          type: array
          description: Byline order.
          items: { $ref: "#/components/schemas/WorkCreator" }
        anonymous: { type: boolean }
        restricted: { type: boolean }
        summary_html: { type: string }
        language: { type: string }
        words: { type: integer }
        chapters_posted: { type: integer }
        chapters_expected:
          { type: integer, description: "Omitted when unknown." }
        complete: { type: boolean }
        published_on:
          {
            type: string,
            format: date,
            description: "Known only from the work page.",
          }
        revised_on: { type: string, format: date }
        stats: { $ref: "#/components/schemas/WorkStats" }
        tags:
          type: array
          description: Page order (grouped by type).
          items: { $ref: "#/components/schemas/WorkTag" }
        series:
          type: array
          items: { $ref: "#/components/schemas/WorkSeriesPart" }
        last_fetched_at:
          {
            $ref: "#/components/schemas/Timestamp",
            description: "The last full fetch; omitted for a blurb-only work.",
          }
    WorkSeriesPart:
      type: object
      description: A series the work is in, without mirror coverage (see `WorkSeries`).
      required: [id, title]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        position:
          {
            type: integer,
            description: "The work's part number; omitted when unknown.",
          }
    WorkCreator:
      type: object
      required: [id, user, pseud]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        user: { type: string, description: "AO3 login (hashed)." }
        pseud: { type: string, description: "Byline name (hashed)." }
    WorkTag:
      type: object
      required: [id, name, type]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        type: { $ref: "#/components/schemas/TagType" }
    WorkCollection:
      type: object
      required: [id, name, title]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string, description: "URL name (hashed)." }
        title: { type: string }
    WorkSeries:
      type: object
      description: |
        A series the work is in, with how much of it is mirrored. `complete_locally` is false
        for a partial series: not a source, with fewer mirrored works than AO3 lists. A series
        whose page was never fetched has `works_total` null and is not partial.
      required:
        [
          id,
          title,
          complete_locally,
          works_total,
          works_mirrored,
          missing_positions,
          missing_work_ids,
        ]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        position:
          {
            type: integer,
            description: "The work's part number; omitted when unknown.",
          }
        complete_locally: { type: boolean }
        works_total: { type: [integer, "null"], description: "AO3's count." }
        works_mirrored: { type: integer }
        missing_positions:
          {
            type: array,
            items: { type: integer },
            description: "Part numbers none of our works has.",
          }
        missing_work_ids:
          {
            type: array,
            items: { $ref: "#/components/schemas/ID" },
            description: "Known member works we have not fetched.",
          }
    ChapterRef:
      type: object
      required: [position]
      additionalProperties: false
      properties:
        id:
          {
            $ref: "#/components/schemas/ID",
            description: "AO3 chapter id; omitted when unknown.",
          }
        position: { type: integer, minimum: 1 }
        title: { type: string }
        published_on: { type: string, format: date }
    Chapter:
      type: object
      description: |
        One chapter with its content. Strings other than `published_on` are content, hashed
        unless revealed. Optional fields are omitted when unset.
      required: [position, body_html]
      additionalProperties: false
      properties:
        id:
          {
            $ref: "#/components/schemas/ID",
            description: "AO3 chapter id; omitted when unknown.",
          }
        position: { type: integer, minimum: 1 }
        title: { type: string }
        published_on: { type: string, format: date }
        summary_html: { type: string, description: "The chapter's own summary." }
        notes_html: { type: string }
        end_notes_html: { type: string }
        body_html: { type: string }
    WorkChapters:
      type: object
      required: [chapters]
      additionalProperties: false
      properties:
        chapters:
          type: array
          description: In order.
          items: { $ref: "#/components/schemas/Chapter" }
    WorkSkin:
      type: object
      additionalProperties: false
      properties:
        css:
          {
            type: string,
            description: "Untrusted CSS (hashed); omitted when the work has none.",
          }
