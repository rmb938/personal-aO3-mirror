  /api/v1/auth/signup:
    post:
      operationId: signup
      summary: Start a signup with an invite.
      security: []
      description: |
        Takes the invite link's token (after `#token=`), a username and a password, and returns
        a new TOTP secret to add to an authenticator app plus the enrollment token to confirm it
        with (`/api/v1/auth/signup/confirm`) before `expires_at` (15 minutes, never past the
        invite). An unusable invite is 401 `invalid-credentials`, checked before anything else;
        then a taken username is 409 `already-exists`, and a password the policy refuses is a
        422 at `/password`. Starting again with the same invite replaces the pending signup.
        Rate limited per client by `api.rate.signup_per_hour`, shared by both steps of signup
        and reset.
      x-problems: [invalid-body, body-too-large, unsupported-media-type, forbidden, invalid-credentials, already-exists]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "200":
          description: The new TOTP secret and the enrollment token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/auth/signup/confirm:
    post:
      operationId: confirmSignup
      summary: Finish a signup with a TOTP code.
      security: []
      description: |
        Creates the account, uses up the invite and returns 10 single-use recovery codes, shown
        only here. Then log in. A wrong code or an unusable enrollment token is 401
        `invalid-credentials`; a username taken meanwhile is 409 `already-exists`.
      x-problems: [invalid-body, body-too-large, unsupported-media-type, forbidden, invalid-credentials, already-exists]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmEnrollmentRequest" }
      responses:
        "201":
          description: The account exists; its recovery codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/auth/reset:
    post:
      operationId: startReset
      summary: Start a reset with a reset link.
      security: []
      description: |
        Takes the reset link's token and, exactly when the link's scope replaces the password,
        the new password (else a 422 at `/password`). When the scope replaces the TOTP secret
        the response holds the new one; otherwise confirm with a code from the current one. An
        unusable link is 401 `invalid-credentials`.
      x-problems: [invalid-body, body-too-large, unsupported-media-type, forbidden, invalid-credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetRequest" }
      responses:
        "200":
          description: The enrollment token, and the new TOTP secret when there is one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/auth/reset/confirm:
    post:
      operationId: confirmReset
      summary: Finish a reset with a TOTP code.
      security: []
      description: |
        Applies the new password and/or TOTP secret, clears the login backoff, revokes every
        session of the account and uses up the link. A reset that replaced the TOTP secret
        returns 10 new recovery codes (shown only here); a password-only reset keeps the current
        ones and returns an empty list. A wrong code or an unusable enrollment token is 401
        `invalid-credentials`. A password-only reset checks the account's current TOTP, so a
        wrong code there counts towards the account's login backoff, and a try during it is 429
        `rate-limited` with `Retry-After`.
      x-problems: [invalid-body, body-too-large, unsupported-media-type, forbidden, invalid-credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmEnrollmentRequest" }
      responses:
        "200":
          description: The reset is applied; new recovery codes, if any.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in, step 1 of 2 - username and password.
      security: []
      description: |
        Returns a challenge token to send with a second factor to `/api/v1/auth/login/totp`
        before `expires_at` (5 minutes). An unknown username, a wrong password and a disabled
        account are the same 401 `invalid-credentials`, so the response never says whether an
        account exists. Each failure (here or at the second step) backs the username off: 1 s,
        doubling up to 15 min, until a full login succeeds. A try during the backoff is 429
        `rate-limited` with `Retry-After` the seconds left, before the password is checked; 100
        failures in a row disable the account until an admin enables it. Rate limited per client
        by `api.rate.login_per_min`.
      x-problems: [invalid-body, body-too-large, unsupported-media-type, forbidden, invalid-credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: The password is right; send the second factor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginChallenge" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/auth/login/totp:
    post:
      operationId: loginTOTP
      summary: Log in, step 2 of 2 - TOTP code or recovery code.
      security: []
      description: |
        Takes the challenge token and exactly one of a TOTP code (never one used before) or an
        unused recovery code (used up here), and starts a session. A wrong factor is 401
        `invalid-credentials` and counts towards the username's backoff (429 with `Retry-After`
        while it lasts); a challenge allows 5 tries, then (like an unknown or expired one) it is
        401 `invalid-credentials` and the login starts again. Rate limited per client by its own
        `api.rate.login_per_min` budget.
      x-problems: [invalid-body, body-too-large, unsupported-media-type, forbidden, invalid-credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginTOTPRequest" }
      responses:
        "200":
          description: Logged in; the session's tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Trade a refresh token for a new token pair.
      security: []
      description: |
        Each refresh token works once: the response holds the next one, and the session's end
        moves to `auth.refresh_ttl` from now (never past `auth.max_session_age` after the
        login). Presenting a refresh token that was already traded means it was copied, so the
        session is revoked. Any refusal (unknown, used, expired or revoked session, disabled
        account) is 401 `invalid-credentials`; log in again. Rate limited per client by
        `api.rate.refresh_per_min`.
      x-problems: [invalid-body, body-too-large, unsupported-media-type, forbidden, invalid-credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: The session's new tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        default: { $ref: "#/components/responses/Problem" }
  # The signed-in user's own account. Like every operation without `security: []`, each needs
  # a bearer access token; the admin socket has no user, so there they are always 401.
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the access token's session.
      description: |
        The session's refresh token stops working, and so does its access token (every request
        checks the session). Needs a bearer access token.
      x-problems: [forbidden]
      responses:
        "204": { description: The session is ended. }
        default: { $ref: "#/components/responses/Problem" }
