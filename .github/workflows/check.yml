# Runs `make check` (lint, race tests, guard hook tests, web UI checks) on every push and pull
# request.
# Tests use internal/fakeao3 with synthetic fixtures: nothing here talks to AO3.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the version used locally (`golangci-lint version`).
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The web UI's checks (make ui-check). The version comes from .node-version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      # make ui-e2e installs Playwright's headless Chromium; --with-deps adds its system
      # libraries (apt, passwordless sudo on the runner).
      - name: make check
        run: make check
        env:
          PLAYWRIGHT_INSTALL_FLAGS: --with-deps
