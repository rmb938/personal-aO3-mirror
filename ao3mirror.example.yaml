# ao3mirror example config. Copy to ao3mirror.local.yaml and fill in contact.discord.
#   cp ao3mirror.example.yaml ao3mirror.local.yaml
#   ./ao3mirror --config ao3mirror.local.yaml config check

# Where meta.db, content.db, images/, logs/ and debug/ live.
# Keep it at ./data so the Claude guard hook covers it.
data_dir: ./data

# REQUIRED. Sent in the User-Agent of every request so AO3 can contact you.
# Must be a Discord handle like "@yourname". The binary refuses to start without it.
contact:
  discord: ""

# Optional text appended to the User-Agent. The base UA (with contact) is always sent.
user_agent_suffix: ""

log:
  level: info              # debug | info | warn | error
  file: logs/ao3mirror.log # relative to data_dir
  max_size_mb: 50          # rotate when larger
  max_files: 5             # rotated files kept

rate:
  interval: 10s            # time between AO3 requests; hard floor 3s
  jitter: 0.2              # +/- fraction of interval
  daily_budget: 0          # max AO3 requests per day; 0 = unlimited

sources:
  auto_confirm_max: 2000            # sources with more works wait for `source confirm`
  default_backfill_order: kudos_desc
  poll_interval: 6h                 # how often each source checks for updates
  full_rescan_interval: 720h        # full re-walk for stats + deletion detection

tags:
  info_ttl: 720h           # refresh tag wrangling info after this long
  # Tag types whose tag pages are fetched for wrangling info (canonical, synonyms, parent
  # fandoms/media). About 1 request per unique tag. Freeform tags are very numerous, so they are
  # off by default; add "Freeform" to include them. [] disables tag-info fetching.
  info_types: [Fandom, Relationship, Character]

series:
  # Fetch the series page (description, notes, words, works count, complete) for series that
  # mirrored works belong to. About 1 request per series. Series added as sources are refreshed
  # by their own polls instead.
  info: true
  info_ttl: 720h           # refresh at least this often; sooner when a member work is revised

images:
  enabled: true
  per_host_interval: 3s
  max_bytes: 26214400      # 25 MiB

content:
  keep_versions: 1         # raw page versions kept per work (last good copy always kept)

# API user accounts (docs/part2-api.md stage 16). Invite-only; auth can't be turned off.
auth:
  access_ttl: 15m          # access token lifetime (5m-1h)
  refresh_ttl: 720h        # idle limit: each refresh extends the session by this (1h-2160h)
  max_session_age: 720h    # a session ends this long after login (refresh_ttl-8760h; NIST AAL1: <= 30d)
  invite_ttl: 24h          # default lifetime of invite and reset links (1m-168h)
  totp_issuer: ao3mirror   # name authenticator apps show (1-32 of A-Z a-z 0-9 space . _ -)
  signing_key_rotation: 720h  # serve replaces the access-token signing key this often (24h-8760h)

# `ao3mirror serve`: the JSON API (docs/part2-api.md). Every fanwork string is hashed unless a
# request asks to reveal it; `serve --no-reveal` refuses even that.
api:
  listen: 127.0.0.1:8080        # public listener; the Cloudflare Tunnel points here. Needs a bearer token (stage 16).
  admin_socket: api/admin.sock  # relative to data_dir; its directory must be mode 700
  trusted_proxies: ["127.0.0.1/32", "::1/128"]  # X-Forwarded-For is trusted only from these peers
  allowed_hosts: ["127.0.0.1", "::1", "localhost"]  # Host names the public listener answers (no port); add the tunnel's domain
  request_timeout: 10s          # per-request deadline (1s-50s)
  hash_key_rotation: 24h        # in-memory random hash key; 0 = once per process; min 1h
  public_url: http://localhost:8080  # origin users reach the API at: token issuer, invite links; host must be in allowed_hosts
  rate:                         # per client IP, public listener (the admin socket allows 10x)
    general_per_min: 120
    search_per_min: 30          # QUERY search routes together (QUERY /works, ...)
    source_add_per_hour: 10     # takes effect with POST /sources (stage 4)
    signup_per_hour: 5          # signup and reset routes together (both steps)
    login_per_min: 10           # each login step (password, then TOTP) separately
    refresh_per_min: 30         # POST /api/v1/auth/refresh
